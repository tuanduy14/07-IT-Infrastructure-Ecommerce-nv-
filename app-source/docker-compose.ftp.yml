# FTP Server noi bo (vung Management). Chay cung compose chinh:
#   docker compose -f docker-compose.yml -f docker-compose.ftp.yml up -d
services:
  ftp:
    image: delfer/alpine-ftp-server
    container_name: ecommerce_ftp
    environment:
      - USERS=backup|backup123
      - ADDRESS=localhost
      - MIN_PORT=21000
      - MAX_PORT=21010
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    volumes:
      - ftp_data:/home/backup
    networks:
      - management

networks:
  management:

volumes:
  ftp_data:
